# Tmux Configuration — Kanagawa Vibrant Theme
# Seamless integration with Neovim via smart-splits
# Designed to work with Aerospace (Alt+hjkl) and Ghostty

# ── General ──────────────────────────────────────────────
set-option -g default-shell /bin/zsh
set-option -g mouse on
set-option -sa terminal-features ',xterm-256color:RGB'
set -g default-terminal "screen-256color"
set -g focus-events on

# ── Status Bar Position ──────────────────────────────────
set -g status-position top

# ── Kanagawa Vibrant Color Palette ───────────────────────
# Matching aerospace active_color=0xffFF9E64 / inactive_color=0xff2a2a37
#   SUMI_INK1  = #1F1F28   (deep background)
#   SUMI_INK3  = #2A2A37   (bar background, matches aerospace inactive)
#   FUJI_GRAY  = #727169   (muted/inactive text)
#   FUJI_WHITE = #DCD7BA   (primary text)
#   SURIMI_ORANGE = #FF9E64 (active accent, matches aerospace active)
#   SPRING_BLUE   = #7FB4CA (info accent)
#   CARP_YELLOW   = #E6C384 (warm highlight)
#   ONI_VIOLET    = #957FB8 (secondary accent)
#   SPRING_GREEN  = #98BB6C (success/green)
#   PEACH_RED     = #FF5D62 (alert/red)

# ── Status Bar Styling ───────────────────────────────────
set -g status-style "bg=#2A2A37,fg=#DCD7BA"
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

# Left: session name with flame separator
set -g status-left "#[bg=#E6C384,fg=#1F1F28,bold]  #S #[bg=#2A2A37,fg=#E6C384] "

# Right: git branch | path | date-time
set -g status-right "#[fg=#7FB4CA,bg=#2A2A37]#[fg=#1F1F28,bg=#7FB4CA,bold]  #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') #[fg=#957FB8,bg=#7FB4CA]#[fg=#1F1F28,bg=#957FB8,bold]  #{b:pane_current_path} #[fg=#727169,bg=#957FB8]#[fg=#DCD7BA,bg=#727169]  %H:%M "

# ── Window Tabs ──────────────────────────────────────────
set -g allow-rename off
set -g automatic-rename off

# Inactive window
set -g window-status-format "#[fg=#2A2A37,bg=#1F1F28]#[fg=#727169,bg=#1F1F28] #I:#{b:pane_current_path} #[fg=#1F1F28,bg=#2A2A37]"

# Active window — surimiOrange matching aerospace active border
set -g window-status-current-format "#[fg=#2A2A37,bg=#FF9E64]#[fg=#1F1F28,bg=#FF9E64,bold] #I:#{b:pane_current_path} #[fg=#FF9E64,bg=#2A2A37]"

set -g window-status-separator ""

# Pickers
bind w choose-tree -Zw -F "#[fg=#727169]#I: #{?window_active,#[fg=#FF9E64#,bold],#[fg=#DCD7BA]}#{b:pane_current_path} #[fg=#727169]#{window_panes} panes"
bind s choose-tree -Zs -F "#{?session_attached,#[fg=#FF9E64#,bold],#[fg=#DCD7BA]}#S #[fg=#727169]#{b:session_path}"
bind c new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"

# ── Pane Borders ─────────────────────────────────────────
set -g pane-border-style "fg=#727169"
set -g pane-active-border-style "fg=#FF9E64"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#1F1F28#,bg=#FF9E64#,bold] #P #[default],#[fg=#727169#,bg=#1F1F28] #P #[default]}"
set -g display-panes-active-colour "#FF9E64"
set -g display-panes-colour "#7FB4CA"
set -g display-panes-time 400

# ── Message & Command Styling ────────────────────────────
set -g message-style "bg=#FF9E64,fg=#1F1F28,bold"
set -g message-command-style "bg=#957FB8,fg=#DCD7BA"
set -g mode-style "bg=#2A2A37,fg=#FF9E64,bold"

# ── Smart-splits Navigation ─────────────────────────────
# Seamless Ctrl+hjkl between neovim splits and tmux panes.
# Checks if the active pane is running neovim; if yes, forwards the
# keypress so smart-splits can handle it. Otherwise tmux navigates.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L; display-panes'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D; display-panes'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U; display-panes'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R; display-panes'

# ── Pane Resizing ────────────────────────────────────────
# prefix + h/j/k/l to resize tmux panes (repeatable with -r)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# ── Splits ───────────────────────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ── Plugins ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
